<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="crewbus app icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <g transform="translate(512 512) scale(3.6) translate(-128 -128)" fill="none" stroke-linecap="round">
    <!-- the bus -->
    <line x1="40" y1="128" x2="216" y2="128" stroke="#E2E8F0" stroke-width="14"/>
    <!-- stems -->
    <g stroke="#2DD4BF" stroke-width="8">
      <line x1="72" y1="88" x2="72" y2="128"/>
      <line x1="128" y1="168" x2="128" y2="128"/>
      <line x1="184" y1="88" x2="184" y2="128"/>
    </g>
    <!-- crew nodes -->
    <g fill="#2DD4BF" stroke="none">
      <circle cx="72" cy="72" r="16"/>
      <circle cx="128" cy="184" r="16"/>
      <circle cx="184" cy="72" r="16"/>
    </g>
    <!-- message in transit -->
    <circle cx="100" cy="128" r="12" fill="#FBBF24" stroke="#0B1020" stroke-width="4"/>
  </g>
</svg>
