<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrewBus</title>
<style>
* {
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
}
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.16);
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.32);
}
::-webkit-scrollbar-thumb:active {
  background: #38d39f;
}
::-webkit-scrollbar-corner {
  background: transparent;
}
body{margin:0;background:#090d12;color:#d7dee6;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;height:100vh}
#shellbar{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;background:#0d1218;border-bottom:1px solid #1f2833;padding:0 14px;height:38px;box-sizing:border-box}
.brand{font-weight:700;font-size:13px;color:#f0f6fc;display:flex;align-items:center;gap:6px;letter-spacing:-0.2px}
.status-pill{display:inline-flex;align-items:center;gap:6px;background:#151c24;border:1px solid #232d39;border-radius:20px;padding:2px 8px;font-size:11px}
#conn-dot{font-size:11px;color:#8b98a5}
.dim{color:#7d8b99;font-size:11px}
.spacer{flex:1}
button{background:#151c24;border:1px solid #2a3644;color:#d7dee6;border-radius:5px;padding:3px 10px;font-size:11px;cursor:pointer;transition:all .15s}
button:hover{border-color:#38d39f;color:#f0f6fc}
button.ghost{border-color:#2a3644;color:#c9d1d9}
button.ghost:hover{border-color:#38d39f;color:#38d39f}
#dashboard{width:100%;height:calc(100vh - 38px);border:0;background:#090d12;display:block}
#status{padding:4px 14px;background:#151c24;border-bottom:1px solid #232d39;font-size:11px;color:#8b98a5}
label.switch{display:flex;gap:6px;align-items:center;font-size:11px;color:#c9d1d9;cursor:pointer}
</style>
</head>
<body>
<header id="shellbar">
  <div class="brand"><b>CrewBus</b></div>
  <div class="status-pill">
    <span id="conn-dot" title="connection: unknown">&#9679;</span>
    <span id="sidecar-url" class="dim">sidecar: connecting&hellip;</span>
  </div>
  <div class="spacer"></div>
  <label class="switch" title="Off = remote-only: stops the sidecar WITHOUT deleting board state">
    <input id="local-env" type="checkbox" checked> Local environment
  </label>
  <button id="pair-open" class="ghost" title="Pair a mobile device via QR code">Pair Mobile (QR)</button>
</header>
<div id="status" class="dim">waiting for the sidecar dashboard URL&hellip;</div>
<!--
  The dashboard UI is NOT duplicated here: this iframe loads the sidecar's
  own page (bin/lib/web.js renderBoardHtml via the additive `serve GET /`
  route, M4b). All Boards/Crews/Fleet/Channels/Triage/Approvals/Results/
  Audit/Settings UI stays server-rendered. This shell only owns: the
  sidecar URL, the connection dot, the Local-environment toggle, and the
  pair-QR window button.
-->
<iframe id="dashboard" title="CrewBus dashboard" src="about:blank"></iframe>
<script type="module" src="./main.js"></script>
</body>
</html>
