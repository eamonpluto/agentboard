name: Release desktop

# Normie-install pipeline: ONLY desktop-v* tags (never every push — CI stays
# untouched). A maintainer bumps apps/desktop versions, pushes e.g.
# `desktop-v0.1.0`, reviews the draft GitHub Release this creates, then
# publishes — normies only ever see published releases. See
# apps/desktop/RELEASE.md for the full maintainer flow.
on:
  push:
    tags: ["desktop-v*"]

# Tag pushes are unique; no cancel-in-progress (a cancelled upload would leave
# a half-attached draft release).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triples: x86_64-pc-windows-msvc
          - os: macos-latest
            triples: x86_64-apple-darwin,aarch64-apple-darwin
          - os: ubuntu-latest
            triples: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: stage bundled node (externalBin)
        run: node scripts/fetch-node.mjs --triple ${{ matrix.triples }}
      - name: install desktop JS deps (Tauri CLI)
        run: npm install --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      - name: install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: build + upload bundles (draft release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: CrewBus ${{ github.ref_name }}
          releaseBody: Normie install — download the bundle for your OS below, double-click, pair your phone via QR. Draft: review before publishing.
          releaseDraft: true
          prerelease: false
          args: --verbose
      - name: checksums (SHA256 over every bundle output)
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"),path=require("node:path"),crypto=require("node:crypto");const root="src-tauri/target/release/bundle";const files=[];(function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else files.push(p);}})(root);for(const f of files.sort()){console.log(crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex")+"  "+f);}console.log(files.length+" bundle file(s) checksummed");if(!files.length)process.exit(1);'
      - name: smoke (static checks + bundle listing)
        shell: bash
        run: |
          node scripts/fetch-node.mjs --check
          node scripts/check.mjs
          ls -R src-tauri/target/release/bundle
