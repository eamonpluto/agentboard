<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="crewbus" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --ink: #0F172A; --bar: #0F172A; --teal: #0D9488; --amber: #F59E0B; --halo: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #F1F5F9; --bar: #E2E8F0; --teal: #2DD4BF; --amber: #FBBF24; --halo: #0B1020; }
    }
    .word { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 104px; letter-spacing: -3px; }
  </style>
  <!-- mark -->
  <g transform="translate(-4 24) scale(0.62)" fill="none" stroke-linecap="round">
    <line x1="40" y1="128" x2="216" y2="128" stroke="var(--bar)" stroke-width="14"/>
    <g stroke="var(--teal)" stroke-width="8">
      <line x1="72" y1="88" x2="72" y2="128"/>
      <line x1="128" y1="168" x2="128" y2="128"/>
      <line x1="184" y1="88" x2="184" y2="128"/>
    </g>
    <g fill="var(--teal)" stroke="none">
      <circle cx="72" cy="72" r="16"/>
      <circle cx="128" cy="184" r="16"/>
      <circle cx="184" cy="72" r="16"/>
    </g>
    <circle cx="100" cy="128" r="12" fill="var(--amber)" stroke="var(--halo)" stroke-width="4"/>
  </g>
  <!-- wordmark -->
  <text class="word" x="152" y="130"><tspan fill="var(--ink)">crew</tspan><tspan fill="var(--teal)">bus</tspan></text>
</svg>
